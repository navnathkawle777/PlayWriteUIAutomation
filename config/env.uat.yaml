environment: UAT

newgen:
  baseUrl: "https://diwhttp01wt.devnet.int/omniapp/"
  homeUrl: "https://diwhttp01wt.devnet.int/omniapp/pages/main/main.app"
  loginPageUrl: "https://diwhttp01wt.devnet.int/omniapp/pages/login/loginapp.app"
  overduePromptUrl: "https://diwhttp01wt.devnet.int/iwui/overdueprompt"
  UserUrl: "https://diwhttp01wt.devnet.int/orm/components/profilemgmt/profilemgmt.app"
  overduePrompt:
    closeButtonSelectors:
      - "button:has-text('Close')"
      - "button:has-text('OK')"
      - "button[type='button']:has-text('Close')"
      - ".close-button"
      - "[aria-label='Close']"
    timeout: 5000
  loginTimeout: 30000
  pageTimeout: 30000

execution:
  headless: false
  slowMo: 100
  maxRetries: 2
  continueOnError: true
  screenshotOnSuccess: true
  screenshotOnFailure: true
  captureTrace: true
  captureVideo: true

evidence:
  outputDir: "./output"
  retentionDays: 90

security:
  credentialSource: "env"
  usernameKey: "NEWGEN_SUPERVISOR_USER"
  passwordKey: "NEWGEN_SUPERVISOR_PASS"

