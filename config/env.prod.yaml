environment: PRODUCTION

newgen:
  baseUrl: "https://newgen-prod.example.com"
  homeUrl: "https://newgen-prod.example.com/omniapp/pages/main/main.app"
  loginPageUrl: "https://newgen-prod.example.com/omniapp/pages/login/loginapp.app"
  overduePromptUrl: "https://newgen-prod.example.com/iwui/overdueprompt"
  UserUrl: "https://newgen-prod.example.com/orm/components/profilemgmt/profilemgmt.app"
  overduePrompt:
    closeButtonSelectors:
      - "button:has-text('Close')"
      - "button:has-text('OK')"
      - "button[type='button']:has-text('Close')"
      - ".close-button"
      - "[aria-label='Close']"
    timeout: 5000
  loginTimeout: 30000
  pageTimeout: 30000

execution:
  headless: true
  slowMo: 50
  maxRetries: 1
  continueOnError: false
  screenshotOnSuccess: true
  screenshotOnFailure: true
  captureTrace: false
  captureVideo: false

evidence:
  outputDir: "./output"
  retentionDays: 180

security:
  credentialSource: "env"
  usernameKey: "NEWGEN_SUPERVISOR_USER"
  passwordKey: "NEWGEN_SUPERVISOR_PASS"